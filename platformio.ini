; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
; Without this, `pio run` / `pio device monitor` fall back to the first env in
; this file (ui1, whose ports are macOS paths). B is the collector, so it is the
; one worth defaulting to. Pass -e explicitly for any other board.
default_envs = dm_sstwr_u2

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Auto-save every monitor session to logs/device-monitor-<YYMMDD-HHMMSS>.log,
; relative to the directory the monitor is started from. Lines are written raw
; -- no timestamp prefix -- so the file stays parseable by
; gat_distance_filter.py --input-log and data_save.py --input-log.
monitor_filters = log2file
lib_deps =
    Dw3000


[env:ui1]
build_src_filter =
    +<ui/*.h>
    +<ui/*.cpp>
build_flags = -D USE_HSPI -D MAIN_U1
lib_deps =
    Dw3000
    sparkfun/SparkFun BNO08x Cortex Based IMU @ ^1.0.5
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0261A474
monitor_port = /dev/cu.usbserial-0261A474

[env:imu]
build_src_filter =
    +<**/*.h>
    +<bno086.cpp>
lib_deps =
    sparkfun/SparkFun BNO08x Cortex Based IMU @ ^1.0.5
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0261A44E
monitor_port = /dev/cu.usbserial-0261A44E

; dm_sstwr: uwb1.cpp (dynamic gateway) and uwb.cpp (fixed gateway C) define the
; same symbols, so exactly one may be compiled. To go back to the fixed gateway,
; drop -<dm_sstwr/uwb.cpp> and -DUSE_DYNAMIC_GATEWAY from every env below.
[env:dm_sstwr_u1]
build_src_filter =
    +<dm_sstwr/*.cpp>
    +<dm_sstwr/*.h>
    -<dm_sstwr/uwb.cpp>
build_flags = -DMAIN_U1 -DUSE_DYNAMIC_GATEWAY
upload_port = COM4
monitor_port = COM4

[env:dm_sstwr_u2]
build_src_filter =
    +<dm_sstwr/*.cpp>
    +<dm_sstwr/*.h>
    -<dm_sstwr/uwb.cpp>
build_flags = -DMAIN_U2 -DUSE_DYNAMIC_GATEWAY
upload_port = COM3
monitor_port = COM3

