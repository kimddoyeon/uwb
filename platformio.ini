; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    Dw3000


[env:ui1]
build_src_filter =
    +<ui/*.h>
    +<ui/*.cpp>
build_flags = -D USE_HSPI -D MAIN_U1
lib_deps =
    Dw3000
    sparkfun/SparkFun BNO08x Cortex Based IMU @ ^1.0.5
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0261A474
monitor_port = /dev/cu.usbserial-0261A474

[env:imu]
build_src_filter =
    +<**/*.h>
    +<bno086.cpp>
lib_deps =
    sparkfun/SparkFun BNO08x Cortex Based IMU @ ^1.0.5
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0261A44E
monitor_port = /dev/cu.usbserial-0261A44E

[env:dm_sstwr_u1]
build_src_filter =
    +<dm_sstwr/*.cpp>
    +<dm_sstwr/*.h>
build_flags = -DMAIN_U1
upload_port = COM3
monitor_port = COM3

[env:dm_sstwr_u2]
build_src_filter =
    +<dm_sstwr/*.cpp>
    +<dm_sstwr/*.h>
build_flags = -DMAIN_U2
upload_port = COM10
monitor_port = COM10

[env:dm_sstwr_u3]
build_src_filter =
    +<dm_sstwr/*.cpp>
    +<dm_sstwr/*.h>
build_flags = -DMAIN_U3
upload_port = COM5
monitor_port = COM5

[env:dm_sstwr_u4]
build_src_filter =
    +<dm_sstwr/*.cpp>
    +<dm_sstwr/*.h>
build_flags = -DMAIN_U4
upload_port = COM7
monitor_port = COM7

[env:dm_sstwr_u5]
build_src_filter =
    +<dm_sstwr/*.h>
    +<dm_sstwr/*.cpp>
build_flags = -DMAIN_U5
upload_port = COM8
monitor_port = COM8

[env:dm_sstwr_u6]
build_src_filter =
    +<dm_sstwr/*.h>
    +<dm_sstwr/*.cpp>
build_flags = -DMAIN_U6
upload_port = COM9
monitor_port = COM9
